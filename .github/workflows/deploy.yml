name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Required so Environment secret FWVISION_PACKAGES_TOKEN (under github-pages)
    # is visible. Repository secrets also work without this; Environment secrets do not.
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check GitHub Packages auth
        env:
          GITHUB_TOKEN_FWVISION: ${{ secrets.FWVISION_PACKAGES_TOKEN }}
        run: bun scripts/check-packages-auth.mjs

      - name: Install dependencies
        run: bun install
        env:
          # Map Environment/Repository secret into the env var .npmrc expects.
          # Secret names cannot start with GITHUB_.
          GITHUB_TOKEN_FWVISION: ${{ secrets.FWVISION_PACKAGES_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.FWVISION_PACKAGES_TOKEN }}

      - name: Build with Astro
        run: bunx astro build
        env:
          GITHUB_TOKEN_FWVISION: ${{ secrets.FWVISION_PACKAGES_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
