name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        env:
          # Cross-repo GitHub Packages (@fw-vision/*) cannot be read with this
          # repo's automatic GITHUB_TOKEN (403). Secret name cannot start with
          # GITHUB_; map FWVISION_PACKAGES_TOKEN (classic PAT, read:packages)
          # into the env var .npmrc expects.
          GITHUB_TOKEN_FWVISION: ${{ secrets.FWVISION_PACKAGES_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.FWVISION_PACKAGES_TOKEN }}

      - name: Build with Astro
        run: bunx astro build
        env:
          GITHUB_TOKEN_FWVISION: ${{ secrets.FWVISION_PACKAGES_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
